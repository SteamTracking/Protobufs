import "citadel_gcmessages_common.proto";
import "citadel_gcmessages_server.proto";
import "google/protobuf/descriptor.proto";

option additional_includes = "citadel_constants.h";

message CMsgCitadelLocalLobbySetup {
	optional fixed64 lobby_handshake_id = 1;
	optional .CSOCitadelLobby lobby = 2;
	optional .CSOCitadelServerStaticLobby static_lobby = 3;
}

message CMsgCitadelLocalLobbyReady {
	optional fixed64 lobby_handshake_id = 1;
	optional uint32 port = 2;
}
